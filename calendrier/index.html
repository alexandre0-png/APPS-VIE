<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#051F20">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calendrier">
<title>Calendrier</title>
<style>
  :root{--c1:#051F20;--c2:#0B2B26;--c3:#163832;--c4:#235347;--c5:#8EB69B;--c6:#DAF1DE}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;font-family:-apple-system,"Helvetica Neue",Arial,system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--c6)}
  body{background:var(--c1)}
  #bg{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,var(--c1) 0%,var(--c1) 12%,var(--c2) 28%,var(--c4) 52%,var(--c5) 78%,var(--c6) 100%);transition:background .3s}
  .app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 22px) 18px 130px}
  .lab{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--c5);font-weight:700}
  h1{font-size:32px;font-weight:800;letter-spacing:-.01em;margin-top:6px;color:var(--c6)}
  .pill{border-radius:999px}
  .imp{margin-top:16px;background:var(--c1);border:1px solid var(--c4);padding:12px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 24px rgba(0,0,0,.25);width:100%;text-align:left;font:inherit;color:var(--c6);cursor:pointer}
  .imp b{font-size:19px;color:var(--c5);white-space:nowrap}
  .imp span{font-size:15px;flex:1;min-width:0;overflow-wrap:anywhere}
  .imp small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--c5)}
  .mcard{margin-top:16px;background:var(--c2);border-radius:30px;padding:16px 12px 12px;box-shadow:0 14px 30px rgba(0,0,0,.35)}
  .mhead{display:flex;align-items:center;justify-content:space-between;padding:0 6px 12px}
  .mhead b{font-size:15px}
  .arrow{width:36px;height:36px;border-radius:50%;background:var(--c3);border:0;color:var(--c5);font:inherit;font-size:18px;cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
  .dow{font-size:11px;color:var(--c5);padding-bottom:6px;font-weight:600}
  .d{height:42px;border-radius:50%;border:0;background:none;color:var(--c6);font:inherit;font-size:14px;position:relative;cursor:pointer}
  .d.out{color:var(--c4)}
  .d.today{outline:1.5px solid var(--c5)}
  .d.sel{background:var(--c6);color:var(--c1);font-weight:700}
  .d i{position:absolute;bottom:5px;left:50%;margin-left:-2px;width:4px;height:4px;border-radius:50%;background:var(--c5)}
  .d.sel i{background:var(--c1)}
  .secl{margin:20px 6px 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--c1);font-weight:800}
  .secl.light{color:var(--c5)}
  .row{background:var(--c3);color:var(--c6);padding:13px 18px;display:flex;align-items:center;gap:12px;font-size:14px;margin-bottom:8px}
  .row .tx{flex:1;min-width:0;overflow-wrap:anywhere}
  .row .tx.done{text-decoration:line-through;color:var(--c5)}
  .row em{font-style:normal;color:var(--c5);font-size:12px;white-space:nowrap}
  .chk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--c5);background:none;flex:none;cursor:pointer;padding:0}
  .chk.on{background:var(--c6);border-color:var(--c6)}
  .del{background:none;border:0;color:var(--c5);font-size:20px;cursor:pointer;line-height:1;padding:0 2px}
  .empty{color:var(--c5);font-size:13px;padding:2px 6px 8px}
  .secl.dk-empty{}
  .wk{margin-top:16px;display:flex;flex-direction:column;gap:10px}
  .cap{border:1px solid var(--c4);border-radius:999px;display:flex;align-items:center;gap:14px;padding:10px 20px 10px 12px;min-height:70px;box-shadow:0 8px 18px rgba(0,0,0,.25);width:100%;font:inherit;text-align:left;cursor:pointer}
  .cap .n{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:800;flex:none}
  .cap .t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
  .cap .t b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
  .cap .t span{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cap .h{font-size:12px;opacity:.85;white-space:nowrap}
  .cap.today{outline:2px solid var(--c6);outline-offset:2px}
  .wnav{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
  .wnav b{font-size:13px;color:var(--c6)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
  .chip{padding:9px 14px;font-size:13px;background:var(--c3);color:var(--c5);border:0;font:inherit;font-size:13px;cursor:pointer;border-radius:999px}
  .chip.on{background:var(--c6);color:var(--c1);font-weight:700}
  input,select{-webkit-appearance:none;appearance:none;min-width:0;height:52px;display:block;background:var(--c1);color:var(--c6);border:1px solid var(--c4);border-radius:999px;padding:14px 18px;font:inherit;font-size:15px;width:100%;margin-bottom:10px;color-scheme:dark}
  .r2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
  .r2 input{margin-bottom:10px;text-align:left}
  .btn{margin-top:6px;background:var(--c6);color:var(--c1);border:0;border-radius:999px;padding:16px;font:inherit;font-weight:700;font-size:15px;width:100%;cursor:pointer}
  nav{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:5;display:flex;justify-content:center;pointer-events:none}
  nav .bar{pointer-events:auto;width:calc(100% - 36px);max-width:444px;background:var(--c1);border:1px solid var(--c4);border-radius:999px;padding:6px;display:flex}
  nav button{flex:1;border:0;background:none;color:var(--c5);font:inherit;font-size:13px;padding:12px 0;border-radius:999px;cursor:pointer}
  nav button.on{background:var(--c6);color:var(--c1);font-weight:700}
  .foot{font-size:11px;text-align:center;margin-top:18px;color:var(--c1);opacity:.7}
</style>
</head>
<body>
<div id="bg"></div>
<div class="app" id="app"></div>
<nav><div class="bar" id="tabs"></div></nav>

<script>
const MONTHS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const DAYS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const TYPES = {task:"Tâche", event:"Rendez-vous", eval:"Évaluation", important:"Important", note:"Ne pas oublier"};
const SCOPES = {day:"Du jour", week:"De la semaine", month:"Du mois"};
const HUES = [[215,45],[315,38],[135,40],[335,55],[12,70],[42,80],[183,70],[32,75],[75,48],[18,70],[0,0],[350,65]];
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const today = () => { const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mondayOf = d => new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay()+6)%7));
const store = {
  get(k,def){ try{ const v=localStorage.getItem(k); return v===null?def:JSON.parse(v); }catch(e){ return def; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

/* ----- Palettes : une par mois (novembre = palette d'origine) ----- */
function palette(m){
  if (m === 10) return ["#051F20","#0B2B26","#163832","#235347","#8EB69B","#DAF1DE"];
  const [h,s] = HUES[m];
  const L = [7,13,21,33,62,91];
  return L.map(l => `hsl(${h} ${s}% ${l}%)`);
}
function applyPalette(m){
  const p = palette(m), r = document.documentElement.style;
  p.forEach((c,i) => r.setProperty("--c"+(i+1), c));
}

/* ----- État ----- */
let items = store.get("cal_items2", []);
let view = "month";
let sel = iso(today());
let cur = new Date(today().getFullYear(), today().getMonth(), 1);
let wk = mondayOf(today());
let addType = "task", addScope = "day";

const save = () => store.set("cal_items2", items);
const byDate = (a,b) => (a.date+(a.time||"")).localeCompare(b.date+(b.time||""));
const dayItems = ds => items.filter(i => i.date === ds && i.type !== "note").sort(byDate);
const labelDate = s => { const d=parse(s); return DAYS[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()]; };

function paletteMonth(){ return parse(sel).getMonth(); }
function shiftMonth(n){
  const d = parse(sel), day = d.getDate();
  const t = new Date(d.getFullYear(), d.getMonth()+n, 1);
  const last = new Date(t.getFullYear(), t.getMonth()+1, 0).getDate();
  sel = iso(new Date(t.getFullYear(), t.getMonth(), Math.min(day,last)));
}
function shiftDays(n){ const d = parse(sel); sel = iso(new Date(d.getFullYear(), d.getMonth(), d.getDate()+n)); }
function syncFocus(){ const d = parse(sel); cur = new Date(d.getFullYear(), d.getMonth(), 1); wk = mondayOf(d); }

/* ----- Blocs communs ----- */
function importantBlock(){
  const t = today(), ts = iso(t);
  const list = items.filter(i => i.type === "important" && i.date >= ts).sort(byDate).slice(0,2);
  return list.map(i => {
    const n = Math.round((parse(i.date) - t) / 86400000);
    return `<button class="imp pill" data-act="go" data-d="${i.date}"><b>${n===0?"Aujourd'hui":"J-"+n}</b><span>${esc(i.title)}</span><small>Important</small></button>`;
  }).join("");
}
function noteBlock(){
  const notes = items.filter(i => i.type === "note");
  return `<div class="secl">Ne pas oublier</div>` + (notes.length ? notes.map(i =>
    `<div class="row pill"><button class="chk ${i.done?"on":""}" data-act="toggle" data-id="${i.id}" aria-label="Fait"></button><span class="tx ${i.done?"done":""}">${esc(i.title)}</span><button class="del" data-act="del" data-id="${i.id}" aria-label="Supprimer">×</button></div>`).join("") : `<div class="empty" style="color:var(--c1)">Rien pour l'instant.</div>`);
}
function itemRow(i){
  const chk = i.type === "task" ? `<button class="chk ${i.done?"on":""}" data-act="toggle" data-id="${i.id}" aria-label="Fait"></button>` : "";
  const tag = i.type === "event" ? "RDV" : i.type === "eval" ? "Éval." : i.type === "important" ? "Important" : (i.scope === "week" ? "Semaine" : i.scope === "month" ? "Mois" : "");
  const meta = [i.time, tag].filter(Boolean).join(" · ");
  return `<div class="row pill">${chk}<span class="tx ${i.done?"done":""}">${esc(i.title)}</span>${meta?`<em>${meta}</em>`:""}<button class="del" data-act="del" data-id="${i.id}" aria-label="Supprimer">×</button></div>`;
}

/* ----- Vue Mois ----- */
function renderMonth(){
  const y = cur.getFullYear(), m = cur.getMonth();
  const off = (new Date(y,m,1).getDay()+6)%7, ts = iso(today());
  let cells = ["L","M","M","J","V","S","D"].map(x => `<div class="dow">${x}</div>`).join("");
  for (let k=0;k<42;k++){
    const d = new Date(y,m,1-off+k), ds = iso(d);
    const cls = ["d", d.getMonth()!==m?"out":"", ds===ts?"today":"", ds===sel?"sel":""].join(" ");
    cells += `<button class="${cls}" data-act="go" data-d="${ds}">${d.getDate()}${items.some(i=>i.date===ds&&i.type!=="note")?"<i></i>":""}</button>`;
  }
  const mk = y+"-"+pad(m+1);
  const goals = items.filter(i => i.type==="task" && i.scope==="month" && i.date.slice(0,7)===mk);
  return `
    <div class="lab">Calendrier</div>
    <h1>${cap(MONTHS[m])} ${y}</h1>
    ${importantBlock()}
    <div class="mcard">
      <div class="mhead"><button class="arrow" data-act="prev">‹</button><b>Tape un jour pour le remplir</b><button class="arrow" data-act="next">›</button></div>
      <div class="grid">${cells}</div>
    </div>
    <div class="secl">Objectifs du mois</div>
    ${goals.length ? goals.map(itemRow).join("") : `<div class="empty" style="color:var(--c1)">Aucun objectif ce mois-ci.</div>`}
    ${noteBlock()}`;
}

/* ----- Vue Semaine ----- */
function renderWeek(){
  const mix = (a,b) => `color-mix(in srgb, var(${a}) 50%, var(${b}))`;
  const bgs = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)",mix("--c4","--c5"),"var(--c5)","var(--c6)"];
  const circ = ["var(--c3)","var(--c4)","var(--c4)",mix("--c4","--c5"),"var(--c6)","var(--c6)","var(--c5)"];
  const ts = iso(today());
  let out = "";
  for (let k=0;k<7;k++){
    const d = new Date(wk.getFullYear(), wk.getMonth(), wk.getDate()+k), ds = iso(d);
    const its = dayItems(ds);
    const fg = k>=5 ? "var(--c1)" : "var(--c6)";
    const first = its[0];
    const txt = its.length ? esc(its.map(i=>i.title).join(" · ")) : "Rien de prévu";
    out += `<button class="cap ${ds===ts?"today":""}" data-act="go" data-d="${ds}" style="background:${bgs[k]};color:${fg}">
      <div class="n" style="background:${circ[k]};color:${k>=4?"var(--c1)":"var(--c6)"}">${d.getDate()}</div>
      <div class="t"><b>${DAYS[d.getDay()]}</b><span>${txt}</span></div>
      ${first&&first.time?`<div class="h">${first.time}</div>`:""}</button>`;
  }
  const end = new Date(wk.getFullYear(), wk.getMonth(), wk.getDate()+6);
  const wkey = iso(wk);
  const goals = items.filter(i => i.type==="task" && i.scope==="week" && iso(mondayOf(parse(i.date)))===wkey);
  return `
    <div class="lab">Semaine du ${wk.getDate()} au ${end.getDate()} ${MONTHS[end.getMonth()]}</div>
    <h1>Cette semaine</h1>
    ${importantBlock()}
    <div class="wnav"><button class="arrow" data-act="wprev">‹</button><b>${cap(MONTHS[wk.getMonth()])} ${wk.getFullYear()}</b><button class="arrow" data-act="wnext">›</button></div>
    <div class="wk">${out}</div>
    <div class="secl">Objectifs de la semaine</div>
    ${goals.length ? goals.map(itemRow).join("") : `<div class="empty" style="color:var(--c1)">Aucun objectif cette semaine.</div>`}`;
}

/* ----- Vue Ajout ----- */
function renderAdd(){
  const d = parse(sel);
  const its = dayItems(sel);
  return `
    <div class="lab">${DAYS[d.getDay()]}</div>
    <h1>${d.getDate()} ${cap(MONTHS[d.getMonth()])}</h1>
    ${importantBlock()}
    <div class="secl light">Déjà prévu ce jour-là</div>
    ${its.length ? its.map(itemRow).join("") : `<div class="empty">Rien pour l'instant.</div>`}
    <div class="secl light">Ajouter</div>
    <div class="chips">${Object.entries(TYPES).map(([k,v]) => `<button class="chip ${addType===k?"on":""}" data-act="type" data-t="${k}">${v}</button>`).join("")}</div>
    <form id="f" autocomplete="off">
      <input name="title" placeholder="Intitulé…" required>
      ${addType==="task" ? `<div class="chips" style="margin-top:0">${Object.entries(SCOPES).map(([k,v]) => `<button type="button" class="chip ${addScope===k?"on":""}" data-act="scope" data-s="${k}">${v}</button>`).join("")}</div>` : ""}
      <div class="r2"><input type="time" name="time" aria-label="Heure"><input type="date" name="date" value="${sel}" required aria-label="Date"></div>
      <button class="btn" type="submit">Ajouter</button>
    </form>`;
}

/* ----- Rendu ----- */
function render(){
  syncFocus();
  applyPalette(paletteMonth());
  const app = document.getElementById("app");
  app.innerHTML = view==="month" ? renderMonth() : view==="week" ? renderWeek() : renderAdd();
  document.getElementById("tabs").innerHTML = [["month","Mois"],["week","Semaine"],["add","Ajout +"]]
    .map(([k,v]) => `<button data-act="tab" data-v="${k}" class="${view===k?"on":""}">${v}</button>`).join("");
  document.querySelector('meta[name="theme-color"]').setAttribute("content", getComputedStyle(document.documentElement).getPropertyValue("--c1").trim());
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const a = b.dataset.act;
  if (a === "tab"){ view = b.dataset.v; }
  else if (a === "go"){ sel = b.dataset.d; view = "add"; }
  else if (a === "prev"){ shiftMonth(-1); }
  else if (a === "next"){ shiftMonth(1); }
  else if (a === "wprev"){ shiftDays(-7); }
  else if (a === "wnext"){ shiftDays(7); }
  else if (a === "toggle"){ const it = items.find(x => x.id===b.dataset.id); if (it){ it.done = !it.done; save(); } }
  else if (a === "del"){ items = items.filter(x => x.id!==b.dataset.id); save(); }
  else if (a === "type"){ addType = b.dataset.t; }
  else if (a === "scope"){ addScope = b.dataset.s; }
  render();
  if (a === "tab" || a === "go") window.scrollTo(0,0);
});

document.addEventListener("submit", e => {
  if (e.target.id !== "f") return;
  e.preventDefault();
  const fd = new FormData(e.target);
  const title = String(fd.get("title")||"").trim();
  if (!title) return;
  const date = String(fd.get("date")||sel);
  items.push({
    id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    type: addType, title, date: addType==="note" ? "" : date,
    time: String(fd.get("time")||""), scope: addType==="task" ? addScope : "", done:false
  });
  save();
  sel = date;
  render();
});

render();
</script>
</body>
</html>
