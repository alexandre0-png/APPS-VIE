<!doctype html><meta charset="utf-8">
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:'Fredoka','Trebuchet MS',sans-serif}
svg{display:block;width:100vw;height:100vh}
.t{font-weight:700;paint-order:stroke;stroke:#1a1020;stroke-linejoin:round}
</style>
<body><div id="root"></div>
<script>
const q=new URLSearchParams(location.search),scene=q.get('s');
const P={
 boar:{b:[139,94,60],d:[92,60,38],l:[238,226,200],a:[255,150,170],r:[['b',24,34,56,28],['d',30,62,8,16],['d',40,62,8,16],['d',62,62,8,16],['d',72,62,8,16],['d',80,36,22,22],['a',100,44,10,10],['l',98,53,10,3],['d',86,31,6,6],['d',32,30,44,5],['e',92,42,3,3]]},
 ostrich:{b:[176,72,56],d:[112,44,38],l:[238,214,176],a:[255,200,50],r:[['b',30,28,40,24],['a',40,52,5,32],['a',56,52,5,32],['l',66,8,7,24],['b',64,2,20,10],['a',82,4,14,5],['d',22,28,10,16],['d',32,30,10,10],['e',78,5,3,3]]},
 rhino:{b:[136,138,150],d:[96,98,110],l:[236,232,218],a:[170,120,80],r:[['b',16,32,64,30],['d',22,62,12,18],['d',38,62,12,18],['d',58,62,12,18],['d',72,62,12,18],['d',78,36,28,26],['l',98,24,7,16],['a',20,30,42,5],['d',84,32,6,7],['e',96,42,3,3]]},
 mammoth:{b:[118,78,50],d:[80,52,34],l:[242,232,204],a:[200,90,60],r:[['b',12,20,72,46],['d',18,66,16,20],['d',40,66,16,20],['d',58,66,16,20],['d',72,66,16,20],['b',82,24,28,32],['d',104,50,8,26],['l',92,56,18,4],['d',86,28,10,18],['d',84,18,26,6],['e',100,34,3,3]]},
 trike:{b:[96,166,98],d:[64,120,72],l:[246,240,214],a:[230,120,60],r:[['b',18,36,60,28],['d',24,64,10,16],['d',38,64,10,16],['d',58,64,10,16],['d',70,64,10,16],['d',10,46,12,8],['a',68,20,14,36],['b',78,40,26,22],['l',100,36,10,4],['l',92,30,4,10],['e',92,46,3,3]]},
 wyvern:{b:[120,70,190],d:[70,40,120],l:[240,230,255],a:[255,110,200],r:[['b',30,40,46,18],['d',10,44,22,6],['a',6,42,8,10],['b',74,36,20,16],['d',92,42,10,8],['l',80,30,4,7],['a',34,18,34,8],['a',40,26,28,8],['e',88,40,3,3]]}
};
const mix=(c,t,a)=>c.map((v,i)=>Math.round(v+(t[i]-v)*a)), css=c=>`rgb(${c.join(',')})`;
function beast(k,x,y,s,gold){const p=P[k];return `<g transform="translate(${x},${y}) scale(${s})">`+p.r.map(r=>{let c=r[0]=='e'?[20,20,20]:p[r[0]];if(gold&&r[0]!='e')c=mix(c,[255,205,60],.65);return `<rect x="${r[1]}" y="${r[2]}" width="${r[3]}" height="${r[4]}" rx="2" fill="${css(c)}"/>`}).join('')+`</g>`}
function rider(x,y,s){return `<g transform="translate(${x},${y}) scale(${s})"><rect x="-7" y="-26" width="14" height="18" fill="#2d7be0"/><rect x="-6" y="-38" width="12" height="12" fill="#f2c9a0"/><rect x="-8" y="-42" width="16" height="5" fill="#8a5a2c"/><rect x="-7" y="-8" width="14" height="10" fill="#233"/></g>`}
function lava(w,h,x=0,y=0){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#lv)"/>`+Array.from({length:14},(_,i)=>`<rect x="${x+(i*97)%w}" y="${y+(i*53)%h}" width="${40+i%4*20}" height="${14}" fill="rgba(255,240,150,.55)" rx="6"/>`).join('')}
function coin(x,y,r){return `<g><circle cx="${x}" cy="${y}" r="${r}" fill="#ffc93c" stroke="#a86b00" stroke-width="${r*.12}"/><circle cx="${x}" cy="${y}" r="${r*.66}" fill="none" stroke="#fff1a8" stroke-width="${r*.1}"/><text x="${x}" y="${y+r*.32}" text-anchor="middle" font-size="${r*.9}" font-weight="700" fill="#a86b00" style="font-family:Fredoka,sans-serif">S</text></g>`}
const defs=`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a4a"/><stop offset=".55" stop-color="#ffd58a"/><stop offset="1" stop-color="#9fd6ff"/></linearGradient><linearGradient id="lv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4f12"/><stop offset="1" stop-color="#ffa72e"/></linearGradient><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ac35a"/><stop offset="1" stop-color="#5c8f3c"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#fff6c0"/><stop offset="1" stop-color="#fff6c000"/></radialGradient></defs>`;
function mountains(W,H){let s='';for(let i=0;i<7;i++){const x=i*W/6-100,h=H*(.18+.1*(i%3));s+=`<polygon points="${x},${H*.72} ${x+W/9},${H*.72-h} ${x+W/4.5},${H*.72}" fill="${i%2?'#b46a52':'#9c5a4a'}"/>`}return s}
function title(W,y,size){return `<text x="${W/2}" y="${y}" text-anchor="middle" class="t" font-size="${size}" fill="#ffd23c" stroke-width="${size*.09}" style="font-family:Fredoka,sans-serif;letter-spacing:${size*.01}px">SAUTE-TROUPEAU</text>`}
function heart(x,y,r,color){const c=color||'#ff60a0';return `<g transform="translate(${x},${y})"><rect x="${-r*.52}" y="${-r*.1}" width="${r*1.04}" height="${r*1.04}" fill="${c}" transform="rotate(45)"/><circle cx="${-r*.5}" cy="${-r*.2}" r="${r*.52}" fill="${c}"/><circle cx="${r*.5}" cy="${-r*.2}" r="${r*.52}" fill="${c}"/></g>`}
function pen(x,y,w,h){let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#caa56a" opacity=".5"/>`;for(let i=0;i<=6;i++)s+=`<rect x="${x+i*w/6-4}" y="${y-30}" width="8" height="${h*.4+30}" fill="#7a5230"/>`;return s+`<rect x="${x}" y="${y-18}" width="${w}" height="8" fill="#8a6038"/>`}
function visitor(x,y,s,c){return `<g transform="translate(${x},${y}) scale(${s})"><rect x="-8" y="-30" width="16" height="22" fill="${c}"/><rect x="-7" y="-44" width="14" height="14" fill="#f2c9a0"/><rect x="-7" y="-8" width="14" height="12" fill="#344"/></g>`}
function bone(x,y,len,r,rot){return `<g transform="translate(${x},${y}) rotate(${rot})"><rect x="${-len/2}" y="${-r*.5}" width="${len}" height="${r}" fill="#f6f0dc" stroke="#cfc6a8" stroke-width="${r*.1}"/><circle cx="${-len/2}" cy="${-r*.6}" r="${r*.7}" fill="#f6f0dc"/><circle cx="${-len/2}" cy="${r*.6}" r="${r*.7}" fill="#f6f0dc"/><circle cx="${len/2}" cy="${-r*.6}" r="${r*.7}" fill="#f6f0dc"/><circle cx="${len/2}" cy="${r*.6}" r="${r*.7}" fill="#f6f0dc"/></g>`}
const txt=(x,y,t,size,fill,sw)=>`<text x="${x}" y="${y}" text-anchor="middle" class="t" font-size="${size}" fill="${fill}" stroke-width="${sw||size*.09}" style="font-family:Fredoka,sans-serif">${t}</text>`;
let W=1920,H=1080,body='';
const bg2=`<rect width="${W}" height="${H}" fill="url(#sky)"/>${mountains(W,H)}<rect y="${H*.72}" width="${W}" height="${H*.28}" fill="url(#gr)"/>`;
if(scene=='hero'){
 body=bg2+`${beast('zebra'in P?'rhino':'rhino',250,700,3.2)}${beast('ostrich',640,590,3.6)}${beast('mammoth',980,650,3.4,true)}${beast('trike',1380,700,3)}${beast('wyvern',1500,300,3.4)}
 ${heart(700,520,46)}${heart(1130,540,52)}${heart(1480,640,40)}${heart(1620,250,40)}
 <path d="M760,540 Q900,400 1090,585" stroke="#e8c37a" stroke-width="8" fill="none"/>${rider(1090,585,4.2)}
 ${txt(W/2,250,'SAUTE-ZOO',200,'#ffd23c')}${txt(W/2,345,'Saute d\'animal en animal. Récupère les cœurs roses !',64,'#fff',7)}`;
}else if(scene=='zoo'){
 body=bg2+`${pen(140,600,400,200)}${pen(620,600,400,200)}${pen(1100,600,400,200)}
 ${beast('rhino',210,640,2.2)}${beast('ostrich',690,560,2.4)}${beast('trike',1180,640,2.1,true)}${beast('boar',1620,760,1.6)}
 ${[0,1,2,3,4,5,6].map(i=>visitor(200+i*230,950+(i%2)*20,3,['#e65a5a','#5a9fe6','#f0c850','#78c878','#c878dc','#f09650','#5ab4e6'][i])).join('')}
 <rect x="1560" y="470" width="260" height="120" rx="14" fill="#ffd23c" stroke="#a86b00" stroke-width="8"/>${txt(1690,560,'+1 200 or',54,'#7a4a00',0)}
 ${txt(W/2,200,'UN ZOO QUI GRANDIT',150,'#ffffff',16)}${txt(W/2,300,'Plus d\'animaux, plus de visiteurs, plus d\'or.',64,'#fff',7)}`;
}else if(scene=='boss'){
 body=`<rect width="${W}" height="${H}" fill="#3b2230"/><rect width="${W}" height="${H*.55}" fill="url(#sky)" opacity=".85"/>${mountains(W,H)}<rect y="${H*.72}" width="${W}" height="${H*.28}" fill="#4a3d44"/>
 ${lava(W,H*.28,0,H*.72)}${beast('mammoth',1000,420,6.2)}${heart(1330,330,70)}${txt(1330,235,'BOSS',70,'#ffd23c')}
 ${beast('ostrich',280,680,3.4)}${rider(480,520,4.4)}<path d="M500,490 Q760,260 1060,420" stroke="#ff9a2e" stroke-width="9" fill="none"/>
 ${txt(520,210,'ATTRAPE LES BOSS',140,'#ff6a3a',14)}${txt(520,310,'Un seul faux pas et c\'est la chute !',64,'#fff',7)}`;
}else if(scene=='icon'){
 W=H=512;body=`<rect width="512" height="512" fill="url(#sky)"/><circle cx="256" cy="170" r="210" fill="url(#glow)"/><polygon points="-20,380 120,200 260,380" fill="#9c5a4a"/><polygon points="200,380 360,170 530,380" fill="#b46a52"/>
 <rect y="360" width="512" height="152" fill="url(#gr)"/>${beast('ostrich',90,220,3.6)}${heart(222,200,36)}${rider(272,330,3)}${beast('rhino',280,336,1.8)}${heart(400,330,22)}
 ${txt(256,76,'SAUTE-',64,'#ffd23c',7)}${txt(256,132,'ZOO',64,'#ffd23c',7)}`;
}else if(scene=='pass-zoo'){
 W=H=512;body=`<rect width="512" height="512" rx="60" fill="#2f5a3a"/><circle cx="256" cy="256" r="230" fill="url(#glow)"/>${pen(90,240,330,150)}${beast('rhino',150,280,1.5)}${heart(300,210,34)}${txt(256,460,'ZOO+',100,'#fff',11)}`;
}else if(scene=='pass-gold'){
 W=H=512;body=`<rect width="512" height="512" rx="60" fill="#27406b"/><circle cx="256" cy="256" r="230" fill="url(#glow)"/>${coin(190,300,110)}${coin(320,250,110)}${txt(256,430,'x2',150,'#fff',16)}`;
}else if(scene=='pass-life'){
 W=H=512;body=`<rect width="512" height="512" rx="60" fill="#5a2a4a"/><circle cx="256" cy="256" r="230" fill="url(#glow)"/>${heart(256,250,150)}${txt(256,440,'+1 VIE',90,'#fff',10)}`;
}else if(scene=='pass-lasso'){
 W=H=512;body=`<rect width="512" height="512" rx="60" fill="#4a3a1a"/><circle cx="256" cy="256" r="230" fill="url(#glow)"/>${[0,1,2,3,4].map(i=>`<ellipse cx="256" cy="${300-i*10}" rx="${150-i*6}" ry="${60-i*3}" fill="none" stroke="#ffd23c" stroke-width="22"/>`).join('')}<path d="M256,240 Q320,120 420,150" stroke="#ffd23c" stroke-width="18" fill="none"/>${heart(380,120,34)}${txt(256,450,'DORÉ',90,'#fff',10)}`;
}else if(scene.startsWith('gold-')){
 W=H=512;const n={s:3,m:7,l:14}[scene.slice(5)],lab={s:'2 000',m:'7 000',l:'25 000'}[scene.slice(5)];
 let c='';for(let i=0;i<n;i++){c+=coin(256+((i*83)%260)-130,330-Math.floor(i/3)*38+((i*17)%30),64)}
 body=`<rect width="512" height="512" rx="60" fill="#3a3a68"/><circle cx="256" cy="256" r="230" fill="url(#glow)"/>${c}${txt(256,110,lab,100,'#ffd23c',11)}`;
}else if(scene.startsWith('bones-')){
 W=H=512;const big=scene.slice(6)=='m';
 body=`<rect width="512" height="512" rx="60" fill="#3a5a68"/><circle cx="256" cy="256" r="230" fill="url(#glow)"/>${bone(256,300,200,46,-25)}${big?bone(256,240,200,46,25)+bone(256,360,200,46,5):''}${txt(256,110,big?'150':'40',110,'#fff',12)}`;
}else if(scene=='boost'){
 W=H=512;body=`<rect width="512" height="512" rx="60" fill="#5a3a7a"/><circle cx="256" cy="256" r="230" fill="url(#glow)"/><circle cx="256" cy="270" r="140" fill="#fff" stroke="#1a1020" stroke-width="12"/><rect x="250" y="180" width="12" height="96" fill="#1a1020"/><rect x="256" y="264" width="70" height="12" fill="#1a1020"/>${txt(256,120,'x2',110,'#ffd23c',12)}${txt(256,468,'30 MIN',70,'#fff',8)}`;
}else if(scene=='revive'){
 W=H=512;body=`<rect width="512" height="512" rx="60" fill="#2a5a4a"/><circle cx="256" cy="256" r="230" fill="url(#glow)"/>${heart(256,260,150)}<rect x="236" y="190" width="40" height="130" fill="#fff"/><rect x="190" y="236" width="132" height="40" fill="#fff"/>${txt(256,456,'CONTINUER',70,'#fff',8)}`;
}
document.getElementById('root').innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${defs}${body}</svg>`;
document.title=scene+'|'+W+'x'+H;
</script>
